
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão F4 - Flexbox</title>


    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .cartao {
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 16px;
            border: 1px solid #ccc;
        }

        .cartao button {
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="cartao">
        <h3>Título do cartão</h3>
        <p>Este é um texto curto.</p>
        <button>Saiba mais</button>
    </div>

</body>
</html>
