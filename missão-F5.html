
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão F5</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .grupo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 24px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .confirmar {
            background-color: #28a745;
        }

        .cancelar {
            background-color: #6c757d;
        }

        .excluir {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="grupo">
        <button class="confirmar">Confirmar</button>
        <button class="cancelar">Cancelar</button>
        <button class="excluir">Excluir</button>
    </div>

</body>
</html>
