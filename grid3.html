<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Missão 3 - Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .pagina-3 {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      min-height: 100vh;
    }

    .pagina-3 header {
      background-color: #2980b9;
      color: white;
      padding: 20px;
    }

    .pagina-3 main {
      background-color: #ecf0f1;
      color: #2c3e50;
      padding: 20px;
    }

    .pagina-3 footer {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="pagina-3">
    <header>
      <h1>Cabeçalho</h1>
    </header>
    <main>
      <h2>Conteúdo principal</h2>
      <p>O main ocupa todo o espaço vertical disponível.</p>
    </main>
    <footer>
      <p>Rodapé</p>
    </footer>
  </div>

</body>
</html>
