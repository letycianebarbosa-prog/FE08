<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Missão 2 - Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .grade-2 {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
    }

    .caixa {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="grade-2">
    <div class="caixa">1</div>
    <div class="caixa">2</div>
    <div class="caixa">3</div>
    <div class="caixa">4</div>
  </div>

</body>
</html>
