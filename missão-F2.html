<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão F2</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #263238;
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header class="topo">
        <span class="logo">LOGO</span>

        <nav class="links">
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

</body>
</html>
